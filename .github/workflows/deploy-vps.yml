name: Deploy to VPS (play.lemnity.ru)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Один деплой за раз; при «server is busy» — Actions → Re-run failed jobs
concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        run: npm i -g pnpm@10.5.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        env:
          NODE_ENV: production
        run: pnpm run build

      - name: Copy files to VPS via rsync over SSH
        uses: burnett01/rsync-deployments@8.0.4
        with:
          # node_modules не копируем — на VPS свой pnpm install (better-sqlite3 и т.д.)
          switches: -avz --delete --exclude=node_modules --exclude=.git --exclude=.next
          path: ./
          remote_path: /var/www/rps-vk-game
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Restart app on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/rps-vk-game
            npm i -g pnpm@10.5.2
            pnpm install --frozen-lockfile
            pnpm rebuild better-sqlite3
            pnpm run build
            # --cwd обязателен: иначе pm2 start без каталога берёт /root и падает с ENOENT package.json
            pm2 delete rps-vk-game || true
            pm2 start pnpm --name rps-vk-game --cwd /var/www/rps-vk-game -- start
            pm2 save
            # Next.js поднимается не мгновенно — иначе verify:assets ловит ECONNREFUSED
            for i in $(seq 1 60); do
              if curl -sf http://127.0.0.1:3000/api/presence/online-count >/dev/null; then
                echo "App is listening on :3000"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "Timeout: nothing on :3000 after 60s"
                pm2 logs rps-vk-game --lines 80 --nostream || true
                exit 1
              fi
              sleep 1
            done
            # Автосинхрон: проверяем, что HTML не ссылается на отсутствующие css/js чанки.
            pnpm run verify:assets -- http://127.0.0.1:3000
